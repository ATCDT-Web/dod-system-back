services:
  db:
    image: postgres:16
    user: "999:999"
    env_file: .env
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    ports:
      - "8082:8082"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
networks:
  internal:
volumes:
  db_data:
